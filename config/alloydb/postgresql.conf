# =====================================================================
# AlloyDB Omni server configuration (llmobs-alloydb)
#
# Reference for every directive below - default value, example values,
# what it means, what it does here, and its trade-off:
#     docs/configDoc/alloydb-configuration-guide.md
#
# Sized for the 2048M cgroup declared in docker-compose.yml. Change that
# limit and shared_buffers / effective_cache_size / max_connections must
# be revisited together.
#
# ACTIVATION: this file is only read because docker-compose.yml mounts it
# and passes `-c config_file=`. Without both, PostgreSQL reads
# /var/lib/postgresql/data/postgresql.conf inside the volume and every
# value here is silently ignored.
#
# WARNING: the first line is load-bearing. AlloyDB Omni writes engine
# settings - shared_preload_libraries above all - into the data-directory
# config. Replacing that file instead of including it unloads the
# columnar engine, ML integration, job scheduler and g_stats.
# =====================================================================

# Inherit everything AlloyDB Omni generated (shared_preload_libraries,
# track_* instrumentation, wal_init_zero, locales), then override below.
include = '/var/lib/postgresql/data/postgresql.conf'

# ---- Connectivity -----------------------------------------------------
listen_addresses = '*'
port = 5432

# AlloyDB Omni sets superuser_reserved_connections = 30 (PostgreSQL's own
# default is 3), so NON-superuser roles only ever get
# max_connections - 30. Temporal alone holds 30 pooled connections
# (20 default store + 10 visibility, see config/temporal/temporal.yaml).
# 80 leaves 50 for non-superuser roles, which still covers Temporal plus
# application pools once the app stops connecting as a superuser.
# Raising this costs only shared bookkeeping, not per-backend memory.
max_connections = 80

# ---- Memory -----------------------------------------------------------
# CRITICAL: AlloyDB Omni auto-sizes shared_buffers from HOST RAM, not the
# cgroup. On this 15 GB host it resolves to ~12 GB inside a 2 GiB
# container. 512MB is the standard 25%-of-available guidance.
shared_buffers = 512MB

# Per sort/hash operation, per query - NOT per session. A query with
# several sorts and hash joins allocates a multiple of this.
work_mem = 8MB

maintenance_work_mem = 64MB

# Planner hint only, allocates nothing. Must describe the cgroup, not the
# host; the inherited value is 4 GB and would make the planner assume
# twice the cache that exists.
effective_cache_size = 1200MB

# ---- AlloyDB Columnar Engine ------------------------------------------
# Currently disabled (google_columnar_engine.enabled = off), but its
# reservation defaults to 1024MB - half this container - and would be
# claimed the moment anyone turns it on. Capped so enabling the engine
# cannot silently blow the cgroup.
google_columnar_engine.memory_size_in_mb = 256

# ---- Write-Ahead Log --------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ---- Planner / Storage ------------------------------------------------
# SSD-backed storage: random reads cost close to sequential ones.
random_page_cost = 1.1
effective_io_concurrency = 200
