# =====================================================================
# AlloyDB Omni server configuration (llmobs-alloydb)
#
# Reference for every directive below - default value, example values,
# what it means, what it does here, and its trade-off:
#     docs/configDoc/alloydb-configuration-guide.md
#
# Sized for the 2048M cgroup declared in docker-compose.yml. Change that
# limit and shared_buffers / effective_cache_size / max_connections must
# be revisited together.
#
# ACTIVATION: this file is only read because docker-compose.yml mounts it
# and passes `-c config_file=`. Without both, PostgreSQL reads
# /var/lib/postgresql/data/postgresql.conf inside the volume and every
# value here is silently ignored.
#
# WARNING: the first line is load-bearing. AlloyDB Omni writes engine
# settings - shared_preload_libraries above all - into the data-directory
# config. Replacing that file instead of including it unloads the
# columnar engine, ML integration, job scheduler and g_stats.
# =====================================================================

# Inherit everything AlloyDB Omni generated (shared_preload_libraries,
# track_* instrumentation, wal_init_zero, locales), then override below.
include = '/var/lib/postgresql/data/postgresql.conf'

# ---- Preloaded libraries ----------------------------------------------
# THE ONE SETTING THAT MUST BE RESTATED RATHER THAN INHERITED.
# Adding pg_stat_statements requires rewriting the whole list, so all five
# AlloyDB engine libraries are repeated verbatim. Drop one by accident and
# that part of the engine silently unloads - verify after every change with
#   SHOW shared_preload_libraries;
# which must list all six, and
#   SELECT count(*) FROM pg_settings WHERE name LIKE 'google%';
# which must still return 73.
shared_preload_libraries = 'g_stats,google_columnar_engine,google_job_scheduler,google_ml_integration,google_storage,pg_stat_statements'

pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off

# ---- Connectivity -----------------------------------------------------
listen_addresses = '*'
port = 5432

# AlloyDB Omni sets superuser_reserved_connections = 30 (PostgreSQL's own
# default is 3), so NON-superuser roles only ever get
# max_connections - 30. Temporal alone holds 30 pooled connections
# (20 default store + 10 visibility, see config/temporal/temporal.yaml).
# 80 leaves 50 for non-superuser roles, which still covers Temporal plus
# application pools once the app stops connecting as a superuser.
# Raising this costs only shared bookkeeping, not per-backend memory.
max_connections = 80

# ---- Statement guardrails ---------------------------------------------
# Without these a single stuck client holds a connection slot and its locks
# indefinitely. They are what make the connection-exhaustion runbook rare
# rather than routine.
#
# statement_timeout is deliberately generous: Temporal's auto-setup runs
# schema DDL through this same connection, and index builds are legitimately
# slow. Raise it per session (SET statement_timeout = 0) for migrations and
# manual VACUUM, never globally. It does NOT apply to autovacuum, which runs
# as a background worker.
statement_timeout = 120s

# An idle-in-transaction session pins its locks AND blocks vacuum from
# reclaiming rows newer than its snapshot. This is the single most valuable
# of the three.
idle_in_transaction_session_timeout = 300s

# Bounds lock pile-ups behind a slow DDL statement. Long enough not to break
# Temporal's schema setup, short enough to fail fast instead of cascading.
lock_timeout = 30s

# ---- Memory -----------------------------------------------------------
# CRITICAL: AlloyDB Omni auto-sizes shared_buffers from HOST RAM, not the
# cgroup. On this 15 GB host it resolves to ~12 GB inside a 2 GiB
# container. 512MB is the standard 25%-of-available guidance.
shared_buffers = 512MB

# Per sort/hash operation, per query - NOT per session. A query with
# several sorts and hash joins allocates a multiple of this.
work_mem = 8MB

maintenance_work_mem = 64MB

# Planner hint only, allocates nothing. Must describe the cgroup, not the
# host; the inherited value is 4 GB and would make the planner assume
# twice the cache that exists.
effective_cache_size = 1200MB

# ---- AlloyDB Columnar Engine ------------------------------------------
# Currently disabled (google_columnar_engine.enabled = off), but its
# reservation defaults to 1024MB - half this container - and would be
# claimed the moment anyone turns it on. Capped so enabling the engine
# cannot silently blow the cgroup.
google_columnar_engine.memory_size_in_mb = 256

# ---- Write-Ahead Log --------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ---- WAL Archiving / Point-In-Time Recovery ---------------------------
# Previously wal_level = replica merely made PITR *possible*; nothing
# implemented it, so losing alloydb_data lost everything since the volume
# was created. These three turn that into a real recovery capability.
#
# DISK RISK, READ THIS: if archive_command ever fails, PostgreSQL retries
# forever and WAL accumulates in pg_wal until the filesystem fills and the
# database stops. The archive target is a dedicated Docker volume so it is
# always writable, and the archive is NOT self-pruning - see the
# pg_archivecleanup step in the guide. Budget roughly 16MB per hour of
# write activity.
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

# Bounds worst-case data loss (RPO) at one hour even if a 16MB segment never
# fills. Lower for a tighter RPO, at 16MB of archive per forced switch.
archive_timeout = 3600

# ---- Planner / Storage ------------------------------------------------
# SSD-backed storage: random reads cost close to sequential ones.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- Autovacuum & Transaction-ID Wraparound ---------------------------
# Temporal's workflow tables are update-heavy, so every row version left
# behind is both bloat and wraparound pressure. Defaults are kept, declared
# explicitly so the wraparound horizon is visible rather than implied.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_freeze_max_age = 200000000

# Surface slow vacuums instead of leaving them invisible; the usual first
# symptom of wraparound trouble is vacuums that keep getting slower.
log_autovacuum_min_duration = 10s

# ---- Query Observability ----------------------------------------------
# Performance logging, distinct from the audit logging (log_connections,
# log_statement) that remains security-owned. Pairs with
# pg_stat_statements: this says WHICH statement was slow and when,
# pg_stat_statements aggregates and ranks them.
log_min_duration_statement = 1000

# Only log temp files at or above work_mem, so this fires exactly when a
# sort or hash spilled to disk.
log_temp_files = 8MB
