apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmobs-temporal-engine
  namespace: llmobs
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: llmobs-temporal-engine
    app.kubernetes.io/component: workflows
    app.kubernetes.io/part-of: llm-obs-infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: llmobs-temporal-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: llmobs-temporal-engine
        app.kubernetes.io/component: workflows
        app.kubernetes.io/part-of: llm-obs-infra
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.24.2
          ports:
            - containerPort: 7233
              name: grpc
              protocol: TCP
            - containerPort: 8080
              name: ui
              protocol: TCP
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: llmobs-credentials
                  key: ALLOYDB_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: llmobs-credentials
                  key: ALLOYDB_PASSWORD
            - name: POSTGRES_SEEDS
              value: "llmobs-alloydb-db.llmobs.svc.cluster.local"
            - name: TEMPORAL_AUTH_ENABLED
              value: "true"
            - name: TEMPORAL_TELEMETRY_TRACING_OTLP_ENDPOINT
              value: "llmobs-otel-collector.llmobs.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "llmobs-temporal-engine"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: llmobs-system-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llmobs-temporal-engine
  namespace: llmobs
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: llmobs-temporal-engine
    app.kubernetes.io/component: workflows
    app.kubernetes.io/part-of: llm-obs-infra
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 8080
      targetPort: ui
      protocol: TCP
      name: ui
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: llmobs-temporal-engine
