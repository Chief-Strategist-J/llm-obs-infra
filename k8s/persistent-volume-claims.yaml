apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloydb-data-pvc
  namespace: llmobs
  labels:
    app.kubernetes.io/part-of: llm-obs-infra
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
