apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: llmobs-canary-rollout
  namespace: llmobs
  labels:
    app.kubernetes.io/name: canary-rollout
    app.kubernetes.io/part-of: llm-obs-infra
    app.kubernetes.io/managed-by: argo-rollouts
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: canary-target
      app.kubernetes.io/instance: llmobs-canary-rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canary-target
        app.kubernetes.io/instance: llmobs-canary-rollout
        app.kubernetes.io/part-of: llm-obs-infra
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: canary-target
          image: chiefj/llmobs-service-registry:latest
          ports:
            - containerPort: 31426
              name: http
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/etc/service-registry/config.json"
            - name: CATALOG_PATH
              value: "/etc/service-registry/services.json"
            - name: OTEL_SERVICE_NAME
              value: "llmobs-canary-rollout"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: llmobs-system-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
  strategy:
    canary:
      canaryService: llmobs-canary-rollout-canary
      stableService: llmobs-canary-rollout-stable
      steps:
        - setWeight: 5
        - pause:
            duration: 120s
        - setWeight: 25
        - pause:
            duration: 120s
        - setWeight: 50
        - pause:
            duration: 120s
        - setWeight: 100
      trafficRouting:
        traefik:
          weightedTraefikServiceName: llmobs-canary-rollout-trafficsplit
---
apiVersion: v1
kind: Service
metadata:
  name: llmobs-canary-rollout-stable
  namespace: llmobs
  labels:
    app.kubernetes.io/name: canary-target
    app.kubernetes.io/instance: llmobs-canary-rollout
    app.kubernetes.io/part-of: llm-obs-infra
    rollout-type: stable
spec:
  type: ClusterIP
  ports:
    - port: 31426
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: canary-target
    app.kubernetes.io/instance: llmobs-canary-rollout
---
apiVersion: v1
kind: Service
metadata:
  name: llmobs-canary-rollout-canary
  namespace: llmobs
  labels:
    app.kubernetes.io/name: canary-target
    app.kubernetes.io/instance: llmobs-canary-rollout
    app.kubernetes.io/part-of: llm-obs-infra
    rollout-type: canary
spec:
  type: ClusterIP
  ports:
    - port: 31426
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: canary-target
    app.kubernetes.io/instance: llmobs-canary-rollout
