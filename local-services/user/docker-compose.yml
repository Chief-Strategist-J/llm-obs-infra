x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  user-service-db:
    image: google/alloydbomni:15
    container_name: user-service-db
    profiles: ["user", "db", "full"]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.0"
        reservations:
          memory: 1024M
          cpus: "0.5"
    ports:
      - "${PORT_USER_DB:-5435}:5432"
    environment:
      - POSTGRES_USER=${USER_DB_USER:-admin}
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD:-user_s3cret_2026}
      - POSTGRES_DB=${USER_DB_NAME:-user_profile_db}
      - ALLOYDB_USER=${USER_DB_USER:-admin}
      - ALLOYDB_PASSWORD=${USER_DB_PASSWORD:-user_s3cret_2026}
      - ALLOYDB_DB=${USER_DB_NAME:-user_profile_db}
      - OTEL_SERVICE_NAME=user-service-db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://user-otel-collector:4318
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/archive && exec /usr/local/bin/docker-entrypoint.sh \"$$@\""
      - "--"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - ../../config/alloydb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../config/alloydb/security-audit.sql:/docker-entrypoint-initdb.d/10-security-audit.sql:ro
      - ../../config/alloydb/init-extensions.sql:/docker-entrypoint-initdb.d/20-init-extensions.sql:ro
      - user_db_data:/var/lib/postgresql/data
      - user_db_archive:/var/lib/postgresql/archive
    networks:
      llmobs-user-network:
        aliases:
          - user-service-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USER_DB_USER:-admin} -d ${USER_DB_NAME:-user_profile_db} || pg_isready -U ${USER_DB_USER:-admin} -d ${USER_DB_NAME:-user_profile_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  user-redis-ledger:
    image: redis:7-alpine
    container_name: user-redis-ledger
    profiles: ["user", "db", "full"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${USER_REDIS_PASSWORD:-user_redis_s3cret_2026}
    ports:
      - "${PORT_USER_REDIS:-6382}:6379"
    environment:
      - OTEL_SERVICE_NAME=user-redis-ledger
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://user-otel-collector:4318
    volumes:
      - user_redis_data:/data
    networks:
      llmobs-user-network:
        aliases:
          - user-redis-ledger
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${USER_REDIS_PASSWORD:-user_redis_s3cret_2026} ping | grep PONG || redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  user-kafka-broker:
    image: apache/kafka:latest
    container_name: user-kafka-broker
    profiles: ["user", "streaming", "full"]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    ports:
      - "${PORT_USER_KAFKA:-9095}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://user-kafka-broker:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1024m
      - OTEL_SERVICE_NAME=user-kafka-broker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://user-otel-collector:4318
    volumes:
      - user_kafka_data:/var/lib/kafka/data
    networks:
      llmobs-user-network:
        aliases:
          - user-kafka-broker
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1 || nc -z 127.0.0.1 9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  user-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: user-otel-collector
    profiles: ["user", "tracing", "full"]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=user-otel-collector
      - GOMEMLIMIT=858993459
    volumes:
      - ../../config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${PORT_USER_OTEL_HTTP:-4323}:4318"
      - "${PORT_USER_OTEL_GRPC:-4324}:4317"
    networks:
      llmobs-user-network:
        aliases:
          - user-otel-collector

  user-service-registry:
    image: chiefj/llmobs-service-registry:latest
    container_name: user-service-registry
    profiles: ["user", "network", "full"]
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "${PORT_USER_SERVICE_REGISTRY:-31429}:31426"
    environment:
      - CONFIG_PATH=/etc/service-registry/config.json
      - CATALOG_PATH=/etc/service-registry/services.json
      - OTEL_SERVICE_NAME=user-service-registry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://user-otel-collector:4318
    volumes:
      - ../../config/service-registry:/etc/service-registry:ro
    networks:
      llmobs-user-network:
        aliases:
          - user-service-registry
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:31426/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      user-otel-collector:
        condition: service_started
        required: false

networks:
  llmobs-user-network:
    name: llmobs-user-network
    driver: bridge

volumes:
  user_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/db/data

  user_db_archive:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/db/archive

  user_redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/redis/data

  user_kafka_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/kafka/data
