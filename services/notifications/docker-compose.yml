x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  notification-service-db:
    image: google/alloydbomni:15
    container_name: notification-service-db
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    ports:
      - "${PORT_NOTIFICATION_DB:-5434}:5432"
    environment:
      - POSTGRES_USER=${NOTIFICATION_DB_USER:-admin}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD:-notification_s3cret_2026}
      - POSTGRES_DB=${NOTIFICATION_DB_NAME:-notification_db}
      - ALLOYDB_USER=${NOTIFICATION_DB_USER:-admin}
      - ALLOYDB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-notification_s3cret_2026}
      - ALLOYDB_DB=${NOTIFICATION_DB_NAME:-notification_db}
      - OTEL_SERVICE_NAME=notification-service-db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://notification-otel-collector:4318
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/archive && exec /usr/local/bin/docker-entrypoint.sh \"$$@\""
      - "--"
    command:
      - "postgres"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
      - notification_db_archive:/var/lib/postgresql/archive
    networks:
      llmobs-notification-network:
        aliases:
          - notification-service-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${NOTIFICATION_DB_USER:-admin} -d ${NOTIFICATION_DB_NAME:-notification_db} || pg_isready -U ${NOTIFICATION_DB_USER:-admin} -d ${NOTIFICATION_DB_NAME:-notification_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  notification-redis-ledger:
    image: redis:7-alpine
    container_name: notification-redis-ledger
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${NOTIFICATION_REDIS_PASSWORD:-notification_redis_s3cret_2026}
    ports:
      - "${PORT_NOTIFICATION_REDIS:-6381}:6379"
    environment:
      - OTEL_SERVICE_NAME=notification-redis-ledger
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://notification-otel-collector:4318
    volumes:
      - notification_redis_data:/data
    networks:
      llmobs-notification-network:
        aliases:
          - notification-redis-ledger
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${NOTIFICATION_REDIS_PASSWORD:-notification_redis_s3cret_2026} ping | grep PONG || redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-kafka-broker:
    image: apache/kafka:latest
    container_name: notification-kafka-broker
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    ports:
      - "${PORT_NOTIFICATION_KAFKA:-9094}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://notification-kafka-broker:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1024m
      - OTEL_SERVICE_NAME=notification-kafka-broker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://notification-otel-collector:4318
    volumes:
      - notification_kafka_data:/var/lib/kafka/data
    networks:
      llmobs-notification-network:
        aliases:
          - notification-kafka-broker
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1 || nc -z 127.0.0.1 9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  notification-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: notification-otel-collector
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=notification-otel-collector
      - GOMEMLIMIT=858993459
    volumes:
      - ../../config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${PORT_NOTIFICATION_OTEL_HTTP:-4321}:4318"
      - "${PORT_NOTIFICATION_OTEL_GRPC:-4322}:4317"
    networks:
      llmobs-notification-network:
        aliases:
          - notification-otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:13133/ || nc -z 127.0.0.1 4318"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-service-registry:
    image: chiefj/llmobs-service-registry:latest
    container_name: notification-service-registry
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "${PORT_NOTIFICATION_SERVICE_REGISTRY:-31428}:31426"
    environment:
      - CONFIG_PATH=/etc/service-registry/config.json
      - CATALOG_PATH=/etc/service-registry/services.json
      - OTEL_SERVICE_NAME=notification-service-registry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://notification-otel-collector:4318
    volumes:
      - ../../config/service-registry:/etc/service-registry:ro
    networks:
      llmobs-notification-network:
        aliases:
          - notification-service-registry
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:31426/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      notification-otel-collector:
        condition: service_started
        required: false

networks:
  llmobs-notification-network:
    name: llmobs-notification-network
    driver: bridge

volumes:
  notification_db_data:
  notification_db_archive:
  notification_redis_data:
  notification_kafka_data:
