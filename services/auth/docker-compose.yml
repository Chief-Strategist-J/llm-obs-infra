x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  auth-service-db:
    image: google/alloydbomni:15
    container_name: auth-service-db
    profiles: ["auth", "db", "full"]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.0"
        reservations:
          memory: 1024M
          cpus: "0.5"
    ports:
      - "${PORT_ALLOYDB:-5432}:5432"
    environment:
      - POSTGRES_USER=${ALLOYDB_USER:-admin}
      - POSTGRES_PASSWORD=${ALLOYDB_PASSWORD:-llmobs_s3cret_2026}
      - POSTGRES_DB=${ALLOYDB_DB:-llm_observability}
      - ALLOYDB_USER=${ALLOYDB_USER:-admin}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-llmobs_s3cret_2026}
      - ALLOYDB_DB=${ALLOYDB_DB:-llm_observability}
      - OTEL_SERVICE_NAME=auth-service-db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/archive && exec /usr/local/bin/docker-entrypoint.sh \"$$@\""
      - "--"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - ../../config/alloydb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../config/alloydb/security-audit.sql:/docker-entrypoint-initdb.d/10-security-audit.sql:ro
      - ../../config/alloydb/init-extensions.sql:/docker-entrypoint-initdb.d/20-init-extensions.sql:ro
      - auth_db_data:/var/lib/postgresql/data
      - auth_db_archive:/var/lib/postgresql/archive
    networks:
      llmobs-auth-network:
        aliases:
          - auth-service-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ALLOYDB_USER:-admin} -d ${ALLOYDB_DB:-llm_observability} || pg_isready -U ${ALLOYDB_USER:-admin} -d ${ALLOYDB_DB:-llm_observability}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  llmobs-redis-ledger:
    image: redis:7-alpine
    container_name: llmobs-redis-ledger
    profiles: ["auth", "db", "full"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-llmobs_redis_s3cret_2026}
    ports:
      - "${PORT_REDIS:-6379}:6379"
    environment:
      - OTEL_SERVICE_NAME=llmobs-redis-ledger
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - auth_redis_data:/data
    networks:
      llmobs-auth-network:
        aliases:
          - llmobs-redis-ledger
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-llmobs_redis_s3cret_2026} ping | grep PONG || redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  llmobs-kafka-broker:
    image: apache/kafka:latest
    container_name: llmobs-kafka-broker
    profiles: ["auth", "streaming", "full"]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    ports:
      - "${PORT_KAFKA:-9092}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://llmobs-kafka-broker:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1024m
      - OTEL_SERVICE_NAME=llmobs-kafka-broker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - auth_kafka_data:/var/lib/kafka/data
    networks:
      llmobs-auth-network:
        aliases:
          - llmobs-kafka-broker
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  llmobs-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: llmobs-otel-collector
    profiles: ["auth", "tracing", "full"]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=llmobs-otel-collector
      - GOMEMLIMIT=858993459
    volumes:
      - ../../config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ../../config/certs:/etc/otel-collector/certs:ro
    ports:
      - "${PORT_OTEL_HTTP:-4318}:4318"
      - "${PORT_OTEL_GRPC:-4317}:4317"
    networks:
      llmobs-auth-network:
        aliases:
          - llmobs-otel-collector

  llmobs-service-registry:
    image: chiefj/llmobs-service-registry:latest
    container_name: llmobs-service-registry
    profiles: ["auth", "network", "full"]
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "${PORT_SERVICE_REGISTRY:-31426}:31426"
    environment:
      - CONFIG_PATH=/etc/service-registry/config.json
      - CATALOG_PATH=/etc/service-registry/services.json
      - OTEL_SERVICE_NAME=llmobs-service-registry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ../../config/service-registry:/etc/service-registry:ro
    networks:
      llmobs-auth-network:
        aliases:
          - llmobs-service-registry
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:31426/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      llmobs-otel-collector:
        condition: service_started
        required: false

networks:
  llmobs-auth-network:
    name: llmobs-auth-network
    driver: bridge

volumes:
  auth_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/db/data

  auth_db_archive:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/db/archive

  auth_redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/redis/data

  auth_kafka_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LLMOBS_DATA_DIR:-./data}/kafka/data
